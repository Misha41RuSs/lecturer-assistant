global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'lecture-broadcasting-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['lecture-broadcasting-service:8082']

  - job_name: 'analytics-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['analytics-service:8084']
